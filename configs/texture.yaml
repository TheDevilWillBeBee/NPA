experiment_name: "texture"
device: "cuda:0"
rng_seed: 42

hashgrid: 
  dim: 2
  boundary: "periodic"
  mode: "grid"
  grid_size: [10, 10]
  eps: 0.2
  max_particles_per_block: 32

npa:
  graft_path: null # Random weight initialization
  # graft_path: "data/pretrained/polka_dotted.pth" # Start from a pretrained model
  kwargs:
    state_dims: 16
    hidden_dims: 128
    eps0: 0.2
    alpha: 0.5

pool:
  pool_size: 512
  num_particles: 4096
#   num_particles: 16384
  sigma: 1.0
  noise_level: 0.0
  seed_mode: "uniform"
  random_seed: 42

train:
  epochs: 12000                      # Number of epochs
  batch_size: 8                      # Batch size
  step_range: [16, 32]               # Number of update steps during training is sampled randomly from this range
  inject_seed_interval: 16           # Number of steps after which a seed state is injected into the pool
  summary_interval: 100              # Interval for logging the training summary
  num_repetitions: 1                 # Number of times to flush the pool and repeat the training process
  noise_std: 0.0
  brush_size: 0.1
  update_prob: 0.5
  
  stability_check_steps: 4096
  stability_check_interval: 1000
  
  optimizer:
    name: AdamW
    kwargs:
      lr: 0.0001
      weight_decay: 0.1
  
  scheduler:
    name: MultiStepLR
    kwargs:
      milestones: [3000, 6000, 9000]
      gamma: 0.3


# Download the texture dataset from:
# https://drive.google.com/file/d/1awJVK4m94qKkfc8jWLbR20OKjFL-52sh/view?usp=sharing
  target: 
    path: 'data/transparent_textures/bubbly_0101.png'      # URL, Path, or Emoji
    aabb: [-1.0, 1.0, -1.0, 1.0]                           # minx, maxx, miny, maxy
    # image_size: [128, 128]
    image_size: null                                       # use num_points to determine the image size
    threshold: 0.02
    num_points: 4096
  
  loss:
    texture_loss_weight: 1.0
    displacement_regularizer_weight: 0.1
    overflow_regularizer_weight: 100.0
    bound_regularizer_weight: 0.0
    
    texture_loss_kwargs:
      grid_size: 128
      sigma: 1.0
      lo: -1.0
      hi: 1.0
      density_loss_weight: 1.0
      color_loss_weight: 1.0
      density_as_texture: True
      normalize_density: True
      replace_max_pool: True
      density_power: 0.1

  
  logger:
    backend: local